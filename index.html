<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>它小灶 · 批发代发报价</title></head><body class="txz">
<style>
:root{
  --bg:#F7F5F1; --card:#FFFFFF; --ink:#26221C; --muted:#8B8378;
  --line:#E9E2D6; --accent:#B8863B; --accent-soft:#F5EBDB;
  --good:#3E8E6B; --good-soft:#E4F0EA;
  --radius:16px; --shadow:0 1px 2px rgba(60,45,20,.05),0 8px 24px rgba(60,45,20,.07);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#171411; --card:#211D18; --ink:#F0EAE0; --muted:#9C9286;
  --line:#332C23; --accent:#D8A455; --accent-soft:#382C19;
  --good:#5FB78D; --good-soft:#1F2E27;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
}}
:root[data-theme="light"]{
  --bg:#F7F5F1; --card:#FFFFFF; --ink:#26221C; --muted:#8B8378;
  --line:#E9E2D6; --accent:#B8863B; --accent-soft:#F5EBDB;
  --good:#3E8E6B; --good-soft:#E4F0EA;
  --shadow:0 1px 2px rgba(60,45,20,.05),0 8px 24px rgba(60,45,20,.07);
}
:root[data-theme="dark"]{
  --bg:#171411; --card:#211D18; --ink:#F0EAE0; --muted:#9C9286;
  --line:#332C23; --accent:#D8A455; --accent-soft:#382C19;
  --good:#5FB78D; --good-soft:#1F2E27;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0}
.txz{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.5;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;padding:20px 14px 56px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
/* 口令门 */
.gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;z-index:20}
.gate.hidden{display:none}
.gate-card{width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:32px 26px;text-align:center}
.gate-mark{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:22px}
.gate h1{font-size:19px;margin:0 0 4px;font-weight:700}
.gate p{color:var(--muted);font-size:13px;margin:0 0 22px}
.gate input{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:11px;background:var(--bg);
  color:var(--ink);font-size:16px;text-align:center;letter-spacing:.05em;outline:none}
.gate input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.gate button{width:100%;margin-top:12px;padding:13px;border:0;border-radius:11px;background:var(--accent);
  color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.gate button:active{transform:translateY(1px)}
.gate .err{color:#C0472F;font-size:13px;margin-top:12px;min-height:18px}
/* 头部 */
.head{display:flex;align-items:center;gap:10px;padding:2px 2px 0}
.badge{width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:16px}
.head .t{font-weight:700;font-size:15px}
.head .s{color:var(--muted);font-size:12px;margin-left:auto}
/* 规则卡 */
.rules{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;font-size:12.5px;color:var(--muted);line-height:1.75}
.rules b{color:var(--ink);font-weight:600}
/* 筛选 */
.filter{display:flex;gap:8px;position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
.filter input{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--ink);font-size:14px;font-family:inherit;box-shadow:var(--shadow);outline:none}
.filter input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.filter select{padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--ink);font-size:13px;font-family:inherit;box-shadow:var(--shadow)}
/* 卡片网格 */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(min-width:520px){.grid{grid-template-columns:1fr 1fr 1fr}}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.pcard:active{transform:scale(.985)}
.pcard .ph{aspect-ratio:1/1;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:30px;overflow:hidden}
.pcard .ph img{width:100%;height:100%;object-fit:cover;display:block}
.pcard .pb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px}
.pcard .pt{font-size:13px;font-weight:600;line-height:1.35}
.pcard .pr{font-size:12px;color:var(--muted)}
.pcard .pr b{color:var(--accent);font-weight:700;font-size:13px}
.secline{display:flex;align-items:baseline;gap:8px;margin:8px 2px 0}
.secline h2{font-size:14px;font-weight:700;margin:0}
.secline span{color:var(--muted);font-size:12px}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:24px}
/* 详情弹层 */
.ovl{position:fixed;inset:0;background:rgba(20,15,8,.5);z-index:30;display:none;align-items:flex-end;justify-content:center}
.ovl.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:88vh;border-radius:20px 20px 0 0;overflow:auto;padding:0 0 30px}
@media(min-width:680px){.ovl{align-items:center}.sheet{border-radius:20px;max-height:86vh}}
.sheet .shd{position:sticky;top:0;background:var(--card);display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);z-index:2}
.sheet .shd .t{font-weight:700;font-size:15px;flex:1;line-height:1.3}
.sheet .shd .x{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--muted);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.sheet .simg{width:100%;max-height:330px;object-fit:cover;display:block}
.sheet .note{margin:12px 16px 0;background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:9px 12px;font-size:12px;line-height:1.6}
.sheet .stn{font-size:13px;font-weight:700;margin:16px 16px 6px}
table.pt2{width:100%;border-collapse:collapse;font-size:13px}
table.pt2 th{color:var(--muted);font-weight:500;font-size:11.5px;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}
table.pt2 td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--line)}
table.pt2 th:first-child,table.pt2 td:first-child{text-align:left;padding-left:16px}
table.pt2 th:last-child,table.pt2 td:last-child{padding-right:16px}
table.pt2 td.pf{font-weight:700;color:var(--accent)}
table.pt2 td.df{font-weight:600}
table.pt2 td.mu{color:var(--muted);font-size:12px}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:10px 0 0;line-height:1.7}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="gate" id="gate">
  <div class="gate-card">
    <div class="gate-mark">🐕</div>
    <h1>它小灶 · 批发代发报价</h1>
    <p>请输入查看口令</p>
    <input id="pass" type="password" inputmode="text" autocomplete="off" placeholder="口令" />
    <button id="go">查看报价</button>
    <div class="err" id="err"></div>
  </div>
</div>

          var raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.iv)},kek,b64(e.wk));
          K=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
          break;
        }catch(x){}
      }
      if(!K)throw new Error('bad pass');
      var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(enc.iv)},K,b64(enc.ct));
      render(JSON.parse(new TextDecoder().decode(pt)));
      gate.classList.add('hidden'); app.style.display='flex';
    }catch(e2){
      go.disabled=false; go.textContent='查看报价';
      err.textContent='口令不对，再试一次'; pass.select();
    }
  }
  go.addEventListener('click',unlock);
  pass.addEventListener('keydown',function(e){if(e.key==='Enter')unlock();});

  function openCard(c){
    var h='<div class="shd"><div class="t">'+esc(c.title)+'</div><button class="x" id="xbtn">✕</button></div>';
    if(c.img)h+='<img class="simg" src="img/'+esc(c.img)+'" alt="">';
    if(c.note)h+='<div class="note">'+esc(c.note)+'</div>';
    var same=c.collapse&&c.styles.length>1;
    var groups=same?[{name:c.styles.map(function(s){return s.name}).join(' / '),rows:c.styles[0].rows}]:c.styles;
    groups.forEach(function(s){
      if(!s.rows.length)return;
      h+='<div class="stn">'+esc(s.name)+'</div>';
      h+='<table class="pt2"><tr><th>'+(c.accessory?'单品':'尺码')+'</th><th>批发</th><th>代发</th><th>控价</th><th>零售</th></tr>';
      s.rows.forEach(function(r){
        h+='<tr><td>'+esc(c.accessory?s.name:r.size)+'</td><td class="pf">¥'+yuan(r.pifa)+'</td><td class="df">¥'+yuan(r.daifa)+
           '</td><td class="mu">¥'+yuan(r.kongjia)+'</td><td class="mu">¥'+yuan(r.retail)+'</td></tr>';
      });
      h+='</table>';
    });
    sheet.innerHTML=h;
    document.getElementById('xbtn').onclick=close;
    ovl.classList.add('show');
    document.body.style.overflow='hidden';
  }
  function close(){ovl.classList.remove('show');document.body.style.overflow='';}
  ovl.addEventListener('click',function(e){if(e.target===ovl)close();});

  function render(d){
    app.appendChild(el('<div class="head"><div class="badge">🐕</div><div class="t">'+esc(d.shop)+' · 批发代发报价</div>'+
      '<div class="s">更新于 '+esc(d.updated)+'</div></div>'));
    var r=d.rules;
    app.appendChild(el('<div class="rules">'+
      '<b>起批</b>：可现做款 '+esc(r.pifa_moq['可现做款'])+'；不可现做款 '+esc(r.pifa_moq['不可现做款'])+'。<br>'+
      '<b>批发进阶</b>：'+esc(r.pifa_plus)+'。<br>'+
      '<b>运费</b>：'+esc(r.freight)+'。<br>'+
      '<b>售后</b>：'+esc(r.returns)+'。</div>'));
    var filt=el('<div class="filter"></div>');
    var q=document.createElement('input');q.type='search';q.placeholder='搜款名 / 花色';
    var sel=document.createElement('select');
    ['全部','可现做款','不可现做款'].forEach(function(o){sel.appendChild(new Option(o,o==='全部'?'':o));});
    filt.appendChild(q);filt.appendChild(sel);app.appendChild(filt);
    var box=el('<div></div>');app.appendChild(box);
    function draw(){
      box.innerHTML='';
      var kw=q.value.trim().toLowerCase(),sec=sel.value,any=false;
      ['可现做款','不可现做款'].forEach(function(section){
        if(sec&&sec!==section)return;
        var cs=d.cards.filter(function(c){
          if(c.section!==section)return false;
          if(!kw)return true;
          var hay=c.title+' '+c.styles.map(function(s){return s.name}).join(' ');
          return hay.toLowerCase().indexOf(kw)>=0;
        });
        if(!cs.length)return;
        any=true;
        var moq=d.rules.pifa_moq[section];
        box.appendChild(el('<div class="secline"><h2>'+section+'</h2><span>批发 '+esc(moq)+'</span></div>'));
        var g=el('<div class="grid"></div>');
        cs.forEach(function(c){
          var pr=c.pifaRange[0]===c.pifaRange[1]?('¥'+yuan(c.pifaRange[0])):('¥'+yuan(c.pifaRange[0])+'–'+yuan(c.pifaRange[1]));
          var ph=c.img?'<img src="img/'+esc(c.img)+'" alt="" loading="lazy">':'🐾';
          var card=el('<div class="pcard"><div class="ph">'+ph+'</div><div class="pb">'+
            '<div class="pt">'+esc(c.title)+'</div>'+
            '<div class="pr">批发 <b>'+pr+'</b> 起 · 点开看分码</div></div></div>');
          card.onclick=function(){openCard(c);};
          g.appendChild(card);
        });
        box.appendChild(g);
      });
      if(!any)box.appendChild(el('<div class="empty">没找到这个款，换个关键词试试</div>'));
    }
    q.addEventListener('input',draw);sel.onchange=draw;draw();
    app.appendChild(el('<div class="foot">它小灶和它的边牧 · 代理专用报价<br>价格以本页为准 · 请勿外传</div>'));
  }
})();
</script>
</body></html>
